<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="dark">
        <title>The Shirley Awards &bullet; Page Not Found</title>
        
        <link rel="icon" type="image/png" href="/src/assets/images/favicon/favicon-96x96.png?v=1" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/src/assets/images/favicon/favicon.svg?v=1" />

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            * { 
                margin: 0; 
                padding: 0; 
                box-sizing: border-box; 
            }

            :root {
                --background: #051123;
                --border: #f7ce84;
                --title: #ffffff;
                --text: #d1d3d7;
                --subtext: #ced0d3;
                --accent: #dfb04f;
                --accent-dimmed: #dfaf4f36;
            }
            
            body { 
                min-height: 100vh; 
                width: 350px;
                margin: 0 auto;
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                justify-content: center; 
                gap: 12px; 
                background: var(--background); 
                color: var(--text); 
                font-family: 'Poppins', sans-serif; 
                font-weight: 500; 
                text-align: center; 
                user-select: none;
            }

            img { 
                width: 300px; 
                height: 300px; 
            }

            h1 { 
                color: var(--accent); 
                letter-spacing: 2px; 
            }

            a { 
                padding: 8px 0; 
                width: 100%;
                font-size: 14px; 
                text-decoration: none;
                color: var(--accent); 
                background: var(--background); 
                border: 1px solid var(--accent-dimmed); 
                border-radius: 8px; 
                transition: border 0.2s ease-in-out, border-radius 0.2s ease-in-out, scale 0.2s ease-in-out;
            }

            a:hover {   
                border: 1px solid var(--accent); 
                border-radius: 6px; 
                scale: 1.01;
            }
        </style>
    </head>
    <body>
        <img src="/src/assets/images/logo.png" alt="The Shirley Awards' Logo" draggable="false">
        <h1>PAGE NOT FOUND</h1>

        <a href="/">Go Home</a>
    </body>
</html>
